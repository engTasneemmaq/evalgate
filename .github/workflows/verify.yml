name: Build and release checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: go test -race ./...
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - run: go build -o /tmp/evalgate ./cmd/evalgate
      - name: Compare release fixtures
        run: |
          result=0
          /tmp/evalgate compare -suite fixtures/suite.json -baseline fixtures/support-v1.json -candidate fixtures/support-v3.json > evaluation.json || result=$?
          if [ "$result" -lt 2 ]; then
            {
              echo '### EvalGate release report'
              jq -r '"Status: **\(.status)**, \(.baseline) → \(.candidate)", (.results[] | .case as $case | .checks[] | select(.passed | not) | "- \($case.title): \(.name) (\(.detail))")' evaluation.json
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$result"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evalgate-report
          path: evaluation.json
          if-no-files-found: ignore
